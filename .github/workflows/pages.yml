name: 'Deploy installer'

# Publishes this folder as a static site on GitHub Pages.
# Settings -> Pages -> Source must be set to "GitHub Actions" once.
#
# The installer is plain HTML/CSS/JS: no build step, nothing to install.

on:
    push:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: 'Checkout'
              uses: actions/checkout@v4

            - name: 'Run the installer tests'
              run: node tests/archive.test.mjs

            - name: 'Configure Pages'
              uses: actions/configure-pages@v5
              with:
                  # Creates/repairs the Pages site automatically, so the first
                  # deploy works even before Pages has been enabled by hand.
                  enablement: true

            - name: 'Upload the site'
              uses: actions/upload-pages-artifact@v3
              with:
                  # Only ship what the browser needs.
                  path: .

            - name: 'Deploy'
              id: deployment
              uses: actions/deploy-pages@v4
